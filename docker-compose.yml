# Host ports are overridable so a second checkout (a git worktree) can run its own stack
# next to this one: `script/worktree-env` writes a root .env with a free set, which
# Compose reads automatically. Without a .env the defaults below apply. The frontend
# finds its backend by the same offset (frontend/js/config.js): 8080+N talks to 3000+N.
services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # RAILS_ENV lives here (not in `environment:` below) so it only applies to the server
    # process. `environment:` is inherited by every `docker compose run backend ...`,
    # including `bundle exec rspec` — which needs to fall back to its own `test` default.
    command: bash -c "export RAILS_ENV=development && rm -f tmp/pids/server.pid && ./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    # Social login (KAN-7) credentials — see backend/.env.example. Optional: the app
    # runs fine without a backend/.env file, social login just won't work yet.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Browser smoke test — run with script/smoke; the profile keeps it out of
  # `docker compose up`. The image tag must match @playwright/test in
  # tools/smoke/package.json, or Playwright can't find its browsers.
  smoke:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["smoke"]
    init: true
    ipc: host
    working_dir: /smoke
    volumes:
      - ./tools/smoke:/smoke
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      CI: ${CI:-}
    # Dependencies go into tools/smoke/node_modules (gitignored), reinstalled only when
    # the lockfile changes.
    command: >
      sh -c "cmp -s package-lock.json node_modules/.installed-lock 2>/dev/null
      || (npm ci --no-audit --no-fund --silent && cp package-lock.json node_modules/.installed-lock);
      npx playwright test"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
