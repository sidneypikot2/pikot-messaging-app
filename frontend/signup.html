<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up · PikotChat</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page">
  <div class="login-layout">
    <section class="login-card">
      <h1>Sign Up</h1>
      <p class="login-subtitle">
        Already have an account? <a href="login.html">Log In</a>
      </p>

      <form id="signup-form" novalidate>
        <p id="form-error" class="form-error" hidden></p>

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

        <label for="first_name">First Name</label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          placeholder="Jane"
          autocomplete="given-name"
          required
        />

        <label for="last_name">Last Name</label>
        <input
          type="text"
          id="last_name"
          name="last_name"
          placeholder="Doe"
          autocomplete="family-name"
          required
        />

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="janedoe"
          autocomplete="username"
          pattern="[a-zA-Z0-9_]{3,30}"
          title="3-30 characters: letters, numbers, and underscores"
          required
        />

        <label for="avatar">Profile Picture (optional)</label>
        <input
          type="file"
          id="avatar"
          name="avatar"
          accept="image/*"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter 8 characters or more"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <label for="password_confirmation">Confirm Password</label>
        <input
          type="password"
          id="password_confirmation"
          name="password_confirmation"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button type="submit" id="signup-submit" class="login-button">Sign Up</button>

        <div class="divider"><span>or sign up with</span></div>

        <div class="social-row">
          <button type="button" id="google-button" class="social-button social-button--google">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            Google
          </button>
          <button type="button" id="facebook-button" class="social-button social-button--facebook">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.89v-6.29H5.31V9h2.29V7.02c0-2.26 1.35-3.51 3.41-3.51.99 0 2.02.18 2.02.18v2.22h-1.14c-1.12 0-1.47.7-1.47 1.41V9h2.5l-.4 2.6h-2.1v6.29A9 9 0 0 0 18 9z"/>
            </svg>
            Facebook
          </button>
        </div>
      </form>

      <div id="signup-success" class="signup-success" hidden>
        <p>
          Account created! We've sent a verification link to
          <strong id="signup-success-email"></strong>. Verify your email, then log in.
        </p>
        <a href="login.html" class="login-button signup-success-link">Go to Login</a>
      </div>
    </section>

    <aside class="login-illustration" aria-hidden="true">
      <svg viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="240" cy="360" rx="180" ry="16" fill="#dfe3f0" />
        <rect x="90" y="70" width="300" height="230" rx="18" fill="#232b6b" />
        <rect x="102" y="82" width="276" height="206" rx="10" fill="#eef0fb" />
        <circle cx="118" cy="96" r="4" fill="#f2994a" />
        <circle cx="132" cy="96" r="4" fill="#f2c94a" />
        <circle cx="146" cy="96" r="4" fill="#6fcf97" />
        <circle cx="240" cy="150" r="26" fill="#c2c9ec" />
        <path d="M215 195a25 25 0 0 1 50 0v10h-50v-10z" fill="#c2c9ec" />
        <rect x="150" y="225" width="180" height="12" rx="6" fill="#c2c9ec" />
        <rect x="150" y="248" width="140" height="12" rx="6" fill="#c2c9ec" />
        <rect x="150" y="271" width="90" height="12" rx="6" fill="#e07f2b" />
        <circle cx="70" cy="150" r="34" fill="#c2c9ec" opacity="0.6" />
        <rect x="52" y="150" width="36" height="46" rx="6" fill="#c2c9ec" opacity="0.6" />
        <circle cx="415" cy="120" r="30" fill="none" stroke="#c2c9ec" stroke-width="6" />
        <path d="M403 120l8 8 16-16" stroke="#f2994a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/oauth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
