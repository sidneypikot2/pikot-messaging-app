<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PikotChat</title>
  <link rel="stylesheet" href="css/messenger.css" />
</head>
<body>
  <div id="messenger" class="messenger">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>PikotChat</h1>
        <button type="button" id="logout-btn" class="logout-btn">Log out</button>
      </div>

      <div class="search-box">
        <input type="text" id="user-search" placeholder="Search people…" autocomplete="off" />
        <ul id="search-results" class="search-results" hidden></ul>
      </div>

      <p id="conversations-status" class="sidebar-status">Loading conversations…</p>
      <ul id="conversation-list" class="conversation-list"></ul>
    </aside>

    <main class="thread">
      <div id="thread-empty" class="thread-empty">
        <p>Select a conversation, or search for someone to start chatting.</p>
      </div>

      <div id="thread-active" class="thread-active" hidden>
        <header class="thread-header">
          <button type="button" id="thread-back" class="thread-back" aria-label="Back to conversations">←</button>
          <div id="thread-avatar" class="avatar"></div>
          <span id="thread-title"></span>
        </header>

        <div id="message-list" class="message-list">
          <p id="pagination-status" class="pagination-status" hidden></p>
        </div>

        <p id="typing-indicator" class="typing-indicator" hidden></p>
        <p id="composer-error" class="composer-error" hidden></p>
        <div id="reply-bar" class="reply-bar" hidden>
          <span id="reply-bar-text" class="reply-bar-text"></span>
          <button type="button" id="reply-bar-cancel" class="reply-bar-cancel" aria-label="Cancel reply">✕</button>
        </div>
        <form id="composer" class="composer">
          <div class="composer-input-wrap">
            <textarea id="composer-input" placeholder="Type a message…" required></textarea>
            <button type="button" id="emoji-picker-btn" class="emoji-picker-btn" aria-label="Insert emoji">🙂</button>
          </div>
          <button type="submit" id="composer-send">Send</button>
        </form>
      </div>
    </main>
  </div>

  <div id="unsend-dialog" class="modal-backdrop" hidden>
    <form id="unsend-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="unsend-title">
      <header class="modal-header">
        <h2 id="unsend-title">Who do you want to unsend this message for?</h2>
        <button type="button" class="modal-close" data-unsend-cancel aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <label class="unsend-option">
          <input type="radio" name="unsend-scope" value="everyone" checked />
          <span>
            <strong>Unsend for everyone</strong>
            <span class="unsend-option-hint">This message will be unsent for everyone in the chat. Others may have already seen it.</span>
          </span>
        </label>
        <label class="unsend-option">
          <input type="radio" name="unsend-scope" value="me" />
          <span>
            <strong>Unsend for you</strong>
            <span class="unsend-option-hint">This will remove the message from your devices. Other chat members will still be able to see it.</span>
          </span>
        </label>
      </div>
      <footer class="modal-footer">
        <button type="button" class="modal-cancel" data-unsend-cancel>Cancel</button>
        <button type="submit" class="modal-confirm">Remove</button>
      </footer>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/cable.js"></script>
  <script src="js/emoji-picker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
