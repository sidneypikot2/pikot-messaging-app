version: 2
# Everything targets staging: main only receives releases (staging -> main).
updates:
- package-ecosystem: bundler
  directory: "/backend"
  target-branch: staging
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Deliberately pinned in the Gemfile (see the comments there) — don't propose these.
  ignore:
  - dependency-name: json
    versions: [ ">= 3" ]
  - dependency-name: redis
    versions: [ ">= 6" ]
# The frontend lint's own dependencies (ESLint) — tooling, not shipped.
- package-ecosystem: npm
  directory: "/tools/frontend-lint"
  target-branch: staging
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
# The Postgres, Redis and nginx images in docker-compose.yml. Major versions are a
# decision (a new Postgres major needs a data migration), and the Playwright image is
# pinned to tools/smoke/package.json — neither is proposed.
- package-ecosystem: docker-compose
  directory: "/"
  target-branch: staging
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  ignore:
  - dependency-name: "*"
    update-types: [ "version-update:semver-major" ]
  - dependency-name: "mcr.microsoft.com/playwright"
- package-ecosystem: github-actions
  directory: "/"
  target-branch: staging
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
