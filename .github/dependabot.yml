version: 2
updates:
- package-ecosystem: bundler
  directory: "/backend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Deliberately pinned in the Gemfile (see the comments there) — don't propose these.
  ignore:
  - dependency-name: json
    versions: [ ">= 3" ]
  - dependency-name: redis
    versions: [ ">= 6" ]
# The frontend lint's own dependencies (ESLint) — tooling, not shipped.
- package-ecosystem: npm
  directory: "/tools/frontend-lint"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
