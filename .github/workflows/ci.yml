name: CI

on:
  pull_request:
  push:
    branches: [ main, staging ]

# The jobs only read the repository.
permissions:
  contents: read

# A new push to a branch makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Rails app lives in backend/; the workflow has to sit at the repo root for GitHub to run it.
defaults:
  run:
    working-directory: backend

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('backend/.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'backend/Gemfile.lock') }}
        with:
          path: backend/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The frontend has no test suite. This runs its static checks — structural rules,
      # the lint that reads each page's scripts in load order (in a Node container), and
      # the real-time event contract with the backend. Same command as locally.
      - name: Check frontend
        working-directory: .
        run: script/check frontend

  tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Claude Code guards and the git hooks are shell: lint them, then run the table
      # of commands they must block and allow. Same command as locally.
      - name: Check tooling
        working-directory: .
        run: script/check tooling

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The only check that runs the app: builds and starts the Compose stack, then drives
      # it in the Playwright container (login, a message between two users in real time).
      - name: Browser smoke test
        working-directory: .
        run: script/smoke

      - name: Backend logs
        if: failure()
        working-directory: .
        run: docker compose logs --tail 200 backend

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tools/smoke/test-results
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    # Postgres only: Action Cable uses the `test` adapter in the test environment, so no Redis.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare the test database
        run: bin/rails db:prepare

      - name: Run specs
        run: bundle exec rspec
