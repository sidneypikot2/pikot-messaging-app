name: PR conventions

# Checks the conventions in CLAUDE.md. A pull request into staging is a task: its branch,
# title and label tie it to a Jira ticket and an area. A pull request into main is a
# release: it comes from staging and nowhere else. Its own workflow so that editing a
# title or a label re-runs this check only, not the test suite.
on:
  pull_request:
    types: [ opened, edited, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

# `gh pr create --label` fires "opened" and "labeled" in the same second; only the newest
# run for a pull request should stand.
concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    # Dependabot names its own branches and titles.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name, title and area label
        # Values come in through the environment, never interpolated into the script:
        # a PR title is untrusted input.
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Read the title and labels as they are now, not as they were in the event
          # that started this run: the "opened" event is sent before its labels are on.
          TITLE="$(gh pr view "$PR" --json title --jq .title)"
          LABELS="$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(" ")')"

          errors=0
          fail() { echo "::error::$1"; errors=$((errors + 1)); }

          # main only takes releases: staging, as a whole, under a dated title.
          if [[ "$BASE" == "main" ]]; then
            [[ "$BRANCH" == "staging" ]] \
              || fail "Only staging is merged into main (a release). Open this pull request against staging."
            [[ "$TITLE" =~ ^Release\ [0-9]{4}-[0-9]{2}-[0-9]{2} ]] \
              || fail "Title '$TITLE' is not 'Release <YYYY-MM-DD>'."
            exit $(( errors > 0 ))
          fi

          if [[ ! "$BRANCH" =~ ^(frontend|backend|infra)/kan-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            fail "Branch '$BRANCH' is not <area>/kan-<n>-<kebab-summary> (area: frontend, backend or infra)."
          fi

          if [[ ! "$TITLE" =~ ^KAN-[0-9]+\ [^[:space:]] ]]; then
            fail "Title '$TITLE' is not 'KAN-<n> <summary>'."
          fi

          areas=0
          for label in $LABELS; do
            case "$label" in frontend|backend|infra) areas=$((areas + 1)) ;; esac
          done
          if (( areas != 1 )); then
            fail "Expected exactly one area label (frontend, backend or infra), found $areas."
          fi

          if [[ "$BRANCH" =~ ^(frontend|backend|infra)/kan-([0-9]+)- ]]; then
            area="${BASH_REMATCH[1]}"; number="${BASH_REMATCH[2]}"
            [[ " $LABELS " == *" $area "* ]] || fail "Branch area '$area' has no matching label."
            [[ "$TITLE" =~ ^KAN-$number\  ]] || fail "Title and branch name different tickets (branch: KAN-$number)."
          fi

          exit $(( errors > 0 ))
